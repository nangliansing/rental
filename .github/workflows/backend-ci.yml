name: Backend CI

on:
  push:
    paths:
      - "rental-be/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "rental-be/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rental-be

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      MONGOMS_VERSION: 7.0.14

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: rental-be/.nvmrc
          cache: npm
          cache-dependency-path: rental-be/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate repository contracts
        run: npm run ci:contracts

      - name: Audit production dependencies
        run: npm run ci:audit

      - name: Build production container
        run: >-
          docker build
          --build-arg BUILD_REVISION=${{ github.sha }}
          --tag rental-be:ci
          .

      - name: Run test suite
        run: npm test
